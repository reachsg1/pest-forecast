# 작물 재배 기간(생물계절) — 권역·시도·시군별
#
# 용도: 작물이 포장에 없는 기간(정식·이앙 전, 수확 후)에는 위험도를 내지 않고 '해당 없음(재배 시기 아님)'으로 표시한다.
#       pipeline/phenology.py 가 읽는다. 기간 자료가 없는 작물은 판정을 생략한다(차단하지 않음).
#
# 규칙 (CLAUDE.md '모델 파라미터' 규칙과 같음)
#  - 날짜는 반드시 근거(source)와 함께 적는다. 근거 없는 "그럴듯한" 날짜는 넣지 않는다.
#  - status: draft(초안) | reviewed(담당 연구자 검토) | active
#  - 같은 작물에 여러 수준이 있으면 가장 구체적인 것을 쓴다: sigungu > sido > zone > national
#  - start > end 이면 해를 넘기는 작기로 본다(예: 11-01 ~ 06-10).
#  - end를 비우면(수확 종료 근거 없음) 시작일 이전만 '재배 시기 아님'으로 판정하고 그 뒤는 재배 중으로 둔다.
#    벼 수확 종료는 농사로 농작업일정(11-11 반영). 고추 수확 종료는 근거 후보 둘(붉은고추 수확 9월 하순 / 연장재배 11월 중순) 중 담당 연구자 결정 대기 — 주간농사정보(농사로 OpenAPI)·평년 첫서리일 등으로 보완 예정.
#
# 기간의 뜻: "작물이 포장에 있는 기간"
#  - 사과: 발아기 ~ 수확 종료    - 벼: 이앙기 ~ 수확 종료    - 고추(노지): 정식기 ~ 수확 종료
#
# 근거로 쓸 수 있는 자료 (2026-11 조사)
#  - 사과 만개일: 국립원예특작과학원 사과생육품질정보 API (data.go.kr 15041539, 관측 농장·연도별 만개일자)
#  - 사과·배·복숭아 휴면타파 시기: 국립원예특작과학원 휴면타파시기 정보 API (data.go.kr 15168306, 67개 기상 관측 지점)
#  - 벼 이앙 적기, 고추 정식기: 농사로(nongsaro.go.kr) 작목별 농업기술길잡이, 도 농업기술원 영농 자료
#  - NCPMS 예찰 조사기간(참고): 예찰 조사 지침의 장비별 조사 기간
#  ※ 연도별로 변하는 시기(만개일 등)는 위 API로 매년 갱신하는 것이 목표(HANDOFF TODO).

# 권역 → 시도(약칭). 행정구역 기준 기본값이며, 농업 기후 권역으로 바꾸려면 담당 연구자와 정한다.
zones:
  수도권: [서울, 인천, 경기]
  강원권: [강원]
  충청권: [대전, 세종, 충북, 충남]
  호남권: [광주, 전북, 전남]
  영남권: [부산, 대구, 울산, 경북, 경남]
  제주권: [제주]

crops:
  apple:
    label: 사과
    window_meaning: 발아기 ~ 수확 종료
    windows:
      # 농사로 작목별 농작업일정(사과): 발아·전엽 3월 중순~4월 상순, 만생종 수확 10월 중순~11월 상순(전국 단위, 순 단위 표)
      - {level: national, region: "", start: "03-11", end: "11-10", status: draft,
         source: "농촌진흥청 농사로 작목별 농작업일정-사과(발아 3월 중순~만생종 수확 11월 상순) https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30663"}
      # 참고(지역별 만개 예측 2025, 국립원예특작과학원): 거창·군위 4/18~20, 장수 4/20~22, 영주·충주 4/21~23, 청송 4/28~30 — 발아는 이보다 이르므로 전국 시작일로 덮임
  rice:
    label: 벼
    window_meaning: 이앙기 ~ 수확 종료
    windows:
      # 이앙 시작 = 지역·지대·숙기별 최적 이앙기 중 가장 이른 날(농촌진흥청 2009 보도자료). 농사로 기계이앙(중북부 5.15~, 남부 5.25~)보다 이른 쪽을 써서
      # 일찍 심은 논을 '재배 시기 아님'으로 잘못 빼지 않게 한다. 남부 조기재배(4월 중순 이앙 사례)는 반영하지 않음.
      # 수확 종료 10-31: 농사로 농작업일정 벼 기계이앙 "수확할때 10월 상순~10월 하순", 직파 "10월 중순~10월 하순"(전국 단일, 지역 구분 없음 → 모든 권역 같은 값)
      - {level: zone, region: 수도권, start: "05-08", end: "10-31", status: draft,
         source: "농촌진흥청 보도자료 '이앙적기 지켜야'(2009.4.14) 중부 중간지·중산간지 중생종 5.8~5.14 https://www.korea.kr/briefing/pressReleaseView.do?newsId=155344300 / 수확 종료: 농사로 농작업일정 벼 기계이앙 수확 10월 상순~하순 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30697"}
      - {level: zone, region: 강원권, start: "05-08", end: "10-31", status: draft,
         source: "농촌진흥청 보도자료 '이앙적기 지켜야'(2009.4.14) 중부 중간지·중산간지 중생종 5.8~5.14 / 수확 종료: 농사로 농작업일정 벼 기계이앙 수확 10월 상순~하순 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30697"}
      - {level: zone, region: 충청권, start: "05-08", end: "10-31", status: draft,
         source: "농촌진흥청 보도자료 '이앙적기 지켜야'(2009.4.14) 중부 중간지·중산간지 중생종 5.8~5.14 / 수확 종료: 농사로 농작업일정 벼 기계이앙 수확 10월 상순~하순 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30697"}
      - {level: zone, region: 영남권, start: "05-10", end: "10-31", status: draft,
         source: "농촌진흥청 보도자료 '이앙적기 지켜야'(2009.4.14) 영남 중산간지 중만생종 5.10~5.17 / 수확 종료: 농사로 농작업일정 벼 기계이앙 수확 10월 상순~하순 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30697"}
      - {level: zone, region: 호남권, start: "05-25", end: "10-31", status: draft,
         source: "농촌진흥청 보도자료 '이앙적기 지켜야'(2009.4.14) 호남 중간지 중만생종 5.25~6.1; 농사로 벼 기계이앙 농작업일정 남부 5.25~6.20 / 수확 종료: 농사로 농작업일정 벼 기계이앙 수확 10월 상순~하순 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30697"}
  pepper:
    label: 고추(노지)
    window_meaning: 정식기 ~ 수확 종료
    windows:
      # 정식 시작: 농사로 고추(보통재배) 농작업일정 '남부 4월 하순~5월 상순, 중부 5월 상순~5월 중순'
      # 남부/중부 배정은 통상의 지방 구분(중부지방=수도권·강원·충청, 남부지방=호남·영남, 제주는 남부로 둠) — 출처에 배정 기준은 없음
      # 수확 종료: 공식 날짜 없음('서리 전까지 수확' 원칙만) → end 비움
      - {level: zone, region: 수도권, start: "05-01", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 중부 5월 상순~5월 중순 정식 https://www.nongsaro.go.kr/portal/ps/psb/psbl/workScheduleDtl.ps?menuId=PS00087&cntntsNo=30600"}
      - {level: zone, region: 강원권, start: "05-01", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 중부 5월 상순~5월 중순 정식"}
      - {level: zone, region: 충청권, start: "05-01", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 중부 5월 상순~5월 중순 정식"}
      - {level: zone, region: 호남권, start: "04-21", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 남부 4월 하순~5월 상순 정식"}
      - {level: zone, region: 영남권, start: "04-21", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 남부 4월 하순~5월 상순 정식"}
      - {level: zone, region: 제주권, start: "04-21", end: null, status: draft,
         source: "농촌진흥청 농사로 고추(보통재배) 농작업일정: 남부 4월 하순~5월 상순 정식(제주는 남부 기준 적용)"}
