# 매일 새벽 05:00 KST(= 20:00 UTC 전날)에 예측을 계산해 정적 JSON을 커밋한다.
# 커밋이 main에 올라가면 Vercel이 자동으로 재배포한다.
# GitHub 예약 실행은 몇 시간 밀리거나 빠지기도 해서 08:00·11:00·14:00 KST에 예비 실행을 둔다.
# 예비 실행은 오늘 결과(summary.json issued_date = 오늘)가 이미 있으면 바로 끝낸다(호출 낭비 없음).
# 고추 3종 학습 모델은 기상청 ASOS 일자료(전날까지)도 쓴다 — 배치가 지점당 1건(약 98건) 받아 data/cache/asos 에 캐시(pipeline/asos.py).
name: daily-forecast

on:
  schedule:
    - cron: "0 20 * * *"   # 05:00 KST
    - cron: "0 23 * * *"   # 08:00 KST 예비
    - cron: "0 2 * * *"    # 11:00 KST 예비
    - cron: "0 5 * * *"    # 14:00 KST 예비
  workflow_dispatch:
    inputs:
      demo:
        description: "합성 기상으로 실행(데모)"
        type: boolean
        default: false
      date:
        description: "기준일 YYYY-MM-DD (비우면 오늘)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      NCPMS_API_KEY: ${{ secrets.NCPMS_API_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}   # 농사로(재배 기간 보완용, 아직 선택)
      NONGSARO_WORKPLAN_KEY: ${{ secrets.NONGSARO2_API_KEY }}   # 농사로 농작업일정(GitHub Secrets 이름은 NONGSARO2_API_KEY, 아직 선택)
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 예약 실행만: 오늘 결과가 이미 있으면 이후 단계를 건너뛴다(수동 실행은 항상 돈다)
      - name: Already done today?
        id: done
        if: github.event_name == 'schedule'
        run: |
          today=$(date +%F)
          issued=$(python3 -c "import json;print(json.load(open('apps/web/public/data/summary.json',encoding='utf-8')).get('issued_date',''))" 2>/dev/null || true)
          if [ "$issued" = "$today" ]; then echo "오늘($today) 결과 있음 → 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.done.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Restore weather cache
        if: steps.done.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: agriweather-${{ github.run_id }}
          restore-keys: agriweather-

      # 키가 없으면 데모로 몰래 바꾸지 않고 실패시킨다(실데이터 지도를 데모로 덮어쓰는 사고 방지).
      # 데모가 필요하면 수동 실행에서 demo를 체크한다.
      - name: Check secrets (live only)
        if: ${{ steps.done.outputs.skip != '1' && !inputs.demo }}
        run: |
          missing=""
          [ -z "$DATA_GO_KR_KEY" ] && missing="$missing DATA_GO_KR_KEY"
          [ -z "$NCPMS_API_KEY" ] && missing="$missing NCPMS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets 없음:$missing — Settings → Secrets and variables → Actions 에 등록하세요. 기존 결과는 그대로 둡니다."
            exit 1
          fi

      - name: Fetch spots (live only)
        if: ${{ steps.done.outputs.skip != '1' && !inputs.demo }}
        run: python -m pipeline.cli spots

      - name: Run forecast
        if: steps.done.outputs.skip != '1'
        id: run
        run: |
          ARGS=""
          if [ "${{ inputs.demo }}" = "true" ]; then ARGS="--demo"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python -m pipeline.cli run $ARGS

      - name: Commit results
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add apps/web/public/data data/predictions data/reference || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): forecast $(date +%F)"
            # 실행 중에 main에 다른 커밋이 올라오면 push가 거부된다 → 최신을 받아 다시 쌓고 push(최대 3회).
            # 결과 파일이 겹치면 이번 배치 결과(-X theirs: 다시 쌓는 쪽)를 쓴다.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "push 재시도 $i"; sleep 5
            done
            exit 1
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `일일 배치 실패 ${new Date().toISOString().slice(0,10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'batch-failure' });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              labels: ['batch-failure'],
              body: `실행 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n전날 결과가 그대로 서비스됩니다. 외부 API 상태와 키 만료 여부를 확인하세요.`
            });
