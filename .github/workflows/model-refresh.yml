# 매주 월요일 07:30 KST(= 일요일 22:30 UTC): 예찰 자료가 충분히 모인 병해충에 학습 모델을 자동으로 추가한다.
# 조건·안전장치는 scripts/auto_models.py(학습 3년·시험 2년·400건 이상, 기본 모델 교체는 앙상블 AUC ≥ 0.75 & 규칙형 +0.10).
# 테스트를 통과해야만 커밋하고, 실패하면 이슈를 연다. 다음 날 05:00 예측 배치부터 새 모델이 지도에 나온다.
name: model-refresh

on:
  schedule:
    - cron: "30 22 * * 0"   # 월 07:30 KST
    - cron: "30 4 * * 1"    # 월 13:30 KST 예비(이번 주 이미 돌았으면 건너뜀)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      NCPMS_API_KEY: ${{ secrets.NCPMS_API_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}
      PESTICIDE_KEY: ${{ secrets.PESTICIDE_KEY }}   # 농약안전정보시스템(PSIS) — 희석배수·사용 시기·횟수
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # 예비 실행: 오늘 이미 갱신했으면 건너뛴다(data/survey/model_refresh_last.txt)
      - name: Already done today?
        id: done
        if: github.event_name == 'schedule'
        run: |
          today=$(date +%F)
          last=$(cat data/survey/model_refresh_last.txt 2>/dev/null || true)
          if [ "$last" = "$today" ]; then echo "오늘 갱신 완료 → 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.done.outputs.skip != '1'
        run: pip install -r requirements.txt
      # 학습용 과거 기상(전국 관측소 월 단위, 처음 1회 약 80건 호출 후 캐시)
      - name: Restore weather history cache
        if: steps.done.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: data/cache/agriweather/_all
          key: weather-hist-${{ github.run_id }}
          restore-keys: weather-hist-
      - name: Fetch weather history
        if: steps.done.outputs.skip != '1'
        run: python scripts/fetch_weather_all.py --years 2015-2025 --months 4-10
      - name: Auto models
        if: steps.done.outputs.skip != '1'
        id: auto
        run: |
          python scripts/auto_models.py | tee auto.log
          if grep -q "^CHANGED" auto.log; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Tests
        if: steps.done.outputs.skip != '1' && steps.auto.outputs.changed == '1'
        run: python -m pytest pipeline/tests -q
      - name: Trends
        if: steps.done.outputs.skip != '1'
        run: python -m pipeline.survey_trend
      # 방제 요령·등록 농약·사용 기준(새 등록·변경 반영). 실패해도 모델 갱신은 계속
      - name: Control info
        if: steps.done.outputs.skip != '1'
        continue-on-error: true
        run: python scripts/build_control_info.py
      - name: Commit
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          date +%F > data/survey/model_refresh_last.txt
          git add models data/survey data/trend data/surveyview data/control || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(models): auto model refresh $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          exit 1
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `모델 자동 추가 실패 ${new Date().toISOString().slice(0,10)}`,
              labels: ['batch-failure'],
              body: `실행 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n테스트를 통과하지 못해 커밋하지 않았습니다. 기존 모델은 그대로 서비스됩니다.`
            });
