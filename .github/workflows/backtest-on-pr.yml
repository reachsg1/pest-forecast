# PR마다 모델 테스트와 백테스트를 돌리고, 데모 실행으로 전체 파이프라인이 깨지지 않았는지 확인한다.
name: backtest-on-pr

on:
  pull_request:
    paths:
      - "models/**"
      - "pipeline/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "models/**"
      - "pipeline/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest pipeline/tests -q
      - name: Demo pipeline
        run: python -m pipeline.cli run --demo --date 2026-07-15
      - name: Backtest (survey.csv 가 있을 때만 의미 있음)
        run: python -m pipeline.backtest --demo
      - name: Upload eval.json
        uses: actions/upload-artifact@v4
        with:
          name: eval-json
          path: models/**/eval.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
