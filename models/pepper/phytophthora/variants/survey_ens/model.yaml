description: 로지스틱 회귀·Random Forest·XGBoost 세 모델의 위험지수를 평균한 종합 판단입니다. 한 모델이 튀어도 영향을
  줄여 가장 안정적입니다.
logic: 예찰+기상 학습형(로지스틱 회귀), Random Forest, XGBoost를 같은 날·같은 지점에서 계산해 평균. 세 모델이 얼마나
  같은 판단을 하는지(합의 수)도 함께 표시합니다.
