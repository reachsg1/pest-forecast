- tavg
- tmin
- rh
- rain
- lwd_hours(결로시간 관측)
- NCPMS 최신 예찰값(시군 피해주율)
- 기상청 ASOS 일조·일사·바람 등(가장 가까운 지점)
label: XGBoost
description: 기상 피처와 최근 예찰값으로 학습한 XGBoost(그래디언트 부스팅 결정나무). 앞선 나무가 틀린 부분을 다음 나무가 보완하며
  쌓는 방식입니다.
logic: NCPMS 노지고추 역병 예찰(2015~2022)로 학습. 깊이·나무 수는 학습 연도 교차검증으로 선택(시험 연도 미사용). 확률×100
  = 위험지수.
