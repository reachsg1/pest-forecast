id: pepper_oriental_tobacco_budworm
pest_id: pepper_oriental_tobacco_budworm
name_ko: 담배나방
name_sci: Helicoverpa assulta
crop: pepper
kind: insect
type: B
version: 0.1.0
horizon_days: 10
season:
  start_month: 5
  end_month: 10
inputs:
- tavg
- tmax
- tmin
description: 고추 과실 속으로 파고드는 나방류. 번데기로 월동하고 연 3세대가 기본이나 기후변화로 2020년 전후부터 4세대 발생이 늘었다(경북 북부). 유충이 과실에 들어가기 전(3령 이전) 방제가 중요.
logic: 발육영점 11.8℃ 기준 유효적산온도(CEDD)를 1월 1일부터 누적. 세대별 성충 발생최성기에 해당하는 CEDD(250·650·1050·1450℃)에 가까울수록 지수를 높인다. 성충 최성기 직후 산란·부화가 이어지므로 이 시기를 방제 적기 신호로 쓴다.
params:
  # 발육영점온도: 이대홍 외(2025)가 인용한 Han et al.(1993)의 값 11.8℃
  base_temp: 11.8
  # 기산일: 논문에 명시 없음 → 1월 1일로 둠(TODO: 담당 연구자 확인)
  biofix: 01-01
  # 상한온도·활동온도: 근거 문헌 없음 → 지정하지 않음(코드 기본 상한 35℃, 활동온도 보정 없음). TODO
  # 구간 폭(ramp_dd): 논문 값 아님. 세대 간격(400℃)의 1/4로 둔 표시용 폭 — 담당 연구자 검토 필요(TODO)
  ramp_dd: 100
  # 세대별 성충 발생최성기 CEDD: 이대홍 외(2025) — 영양 2016~2022년 페로몬트랩 최성기와 일평균기온 비교로 설정
  # peak(세대별 가중치)는 근거가 없어 모두 100으로 둠
  generations:
  - name: 1세대 성충 최성기
    dd_from: 250
    dd_to: 250
    peak: 100
  - name: 2세대 성충 최성기
    dd_from: 650
    dd_to: 650
    peak: 100
  - name: 3세대 성충 최성기
    dd_from: 1050
    dd_to: 1050
    peak: 100
  - name: 4세대 성충 최성기
    dd_from: 1450
    dd_to: 1450
    peak: 100
references:
- 이대홍, 박성임, 이효진, 장길수, 조현석, 권오훈, 이상석 (2025) 경북 북부지역 노지고추 담배나방 발생양상 및 방제전략. 농약과학회지 29(3):174-187. doi:10.7585/kjps.2025.29.3.174 — 발육영점 11.8℃, 세대별 CEDD 250/650/1050/1450℃, 영양 성충 최성기(6월 3~5주, 7월 4주~8월 1주, 8월 4주~9월 1주, 9월 3주)
- 한만위, 이준호, 이문홍 (1993) 담배나방 발육에 미치는 온도의 영향. 한국응용곤충학회지 32(2):236-244 — 단계별 발육영점(알 8.62, 유충 12.65, 번데기 11.64℃)
- 고추포장 성충 활동기간 5월 하순~10월 상순(고추포장 담배나방 수컷 발생소장, 한국응용곤충학회지 2004) — season 근거
- NCPMS 예측모형 '담배나방1세대'(모형코드 1000000015, 운영 01-01~09-27), NCPMS 예찰 고추(노지) '담배나방(피해과율)' — 비교·검증 대상
owner: ''
