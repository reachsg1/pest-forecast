  end_month: 9
inputs:
- tavg
- tmin
- rh
- rain
- lwd_hours(결로시간 관측)
- NCPMS 최신 예찰값(시군 피해과율)
label: 예찰+기상 학습형
description: 예찰 학습형에 '그 시군의 가장 최근 예찰 조사값'을 더한 모델. 직전 회차에 발생한 시군은 다음에도 발생할 가능성이 높다는
  점을 반영합니다. 지점 시군에 예찰이 없으면 가장 가까운 예찰 시군의 값을 씁니다.
logic: 기상 피처 10개 + 최근 예찰값 log(1+피해과율)을 표준화해 가중합 → 로지스틱 확률. 예찰값은 매일 배치 때 NCPMS(SVC51~53)에서
  올해 회차를 받아, 그날 이전 가장 최근 회차 값을 씁니다(첫 회차 전에는 0). 2023~2025년(학습에 쓰지 않은 해) 검증에서 같은 시기
  시군 간 변별력이 기상만 쓴 모델보다 크게 높습니다(검증 탭).
