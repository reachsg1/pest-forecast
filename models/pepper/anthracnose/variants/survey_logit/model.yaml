- lwd_hours(결로시간 관측)
label: 로지스틱 회귀(기상만)
description: NCPMS 노지고추 탄저병 예찰(2015~2024, 시군구 피해과율)과 같은 시군 농업기상 관측소 일자료로 학습한 로지스틱
  모델. '그 시기에 그 시군에서 탄저병이 발생했을 확률'을 위험지수(0~100)로 냅니다.
logic: 조사일 전날까지 기상으로 만든 10개 피처(최근 14일 기온·습도·강수·결로, 최근 30일 결로, 6월 1일 이후 강수일수 등, 연중
  일차)를 표준화해 가중합 → 로지스틱 확률. 2025~2026년(학습에 쓰지 않은 해) 검증에서 현재 기본 모델보다 크게 낫지만, 대부분은 계절
  진행(시기)을 맞힌 효과이고 같은 시기 시군 간 차이를 가르는 힘은 약합니다(검증 탭 참고).
