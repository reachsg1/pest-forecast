description: 20~28℃의 서늘하고 비·이슬이 잦아 잎이 오래 젖는 날이 이어질 때 감염 급증. 일조 부족·질소 과다 시 심해짐.
logic: 온도 적합도 × 잎젖음 충족도 누적(감염 부하). NCPMS '도열병 방제결정지원'과 비교 검증 예정.
