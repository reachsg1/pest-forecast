description: '기상 피처와 최근 예찰값으로 학습한 Random Forest(결정나무 500개의 다수결). 변수 사이의 복잡한 조합(예:
  비가 잦으면서 기온이 적당한 시기)을 스스로 찾습니다.'
logic: NCPMS 논벼 잎도열병 예찰(2015~2024)로 학습. 나무 수·잎 최소 표본은 학습 연도 안에서 한 해씩 빼고 검증해 골랐습니다(시험
  연도 2025~2026는 선택에 쓰지 않음). 확률×100 = 위험지수.
